config_name: arx_x5

config:
  sim: sim_config
  scene: default
  robot: dual_x5
  camera: camera_config

# Optional native TacEx/UIPC GelSight integration. Keep disabled for the
# benchmark's stock RGB/state evaluation. Enable only after validating the X5
# body and prim paths in a local Isaac scene (see docs/tactile.md).
tactile:
  enabled: false

observation:
  collect_freq: 25
  robot:
    joint_states: true
    world_ee_state: true
  vision:
    approximate_depth: false
    depth: false
    intrinsic_matrix: false
    extrinsic_matrix: false
    shape: true
