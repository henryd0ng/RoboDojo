# The left arm has tactile pads; the right arm keeps the stock X5 fingers.
robots:
  - robot_type: arm
    robot_name: x5_pad
    coupled: false
    default_root_pos: [-0.3, -0.45, 0.765]
    default_root_rot: [0.707, 0, 0, 0.707]
    grasp_perfect_direction: top_down_little_right
  - robot_type: arm
    robot_name: x5
    coupled: false
    default_root_pos: [0.3, -0.45, 0.765]
    default_root_rot: [0.707, 0, 0, 0.707]
    grasp_perfect_direction: top_down_little_left
